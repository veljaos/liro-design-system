# Changing this file is a protected change (BUILD-PLAN rule 10).
#
# Publishes @veljaos/tokens, @veljaos/ui and @veljaos/eslint-config to GitHub Packages when a
# version tag (v0.1.0-alpha.0, v1.0.0, …) is pushed. It uses the workflow's own GITHUB_TOKEN with
# packages: write; no personal token exists anywhere. The tagged commit must be on main (so it
# passed the required checks) and the tag must equal the version of every package.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: The tag equals every package version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs"
            const version = process.env.TAG.replace(/^v/, "")
            for (const name of ["tokens", "ui", "eslint-config"]) {
              const manifest = JSON.parse(readFileSync(`packages/${name}/package.json`, "utf8"))
              if (manifest.version !== version) {
                console.error(`${manifest.name} is ${manifest.version}, the tag says ${version}`)
                process.exit(1)
              }
            }
            // A prerelease (0.1.0-alpha.0) goes to its own dist-tag (alpha), never to latest.
            const distTag = version.includes("-") ? version.split("-")[1].split(".")[0] : "latest"
            appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\ndist-tag=${distTag}\n`)
            console.log(`version ${version}, dist-tag ${distTag}`)
          '

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Consumer check (packed tarballs)
        run: pnpm consumer-check

      - name: Storybook build
        run: pnpm build-storybook

      # The token is referenced as ${NODE_AUTH_TOKEN} and expanded by pnpm; it is never written
      # to disk. It exists only in the steps that need it.
      - name: Registry configuration
        run: |
          printf '%s\n' \
            '@veljaos:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> "$HOME/.npmrc"

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: pnpm -r publish --no-git-checks --tag "$DIST_TAG"

      - name: The packages are in the registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for name in tokens ui eslint-config; do
            published=$(pnpm view "@veljaos/$name@$VERSION" version)
            test "$published" = "$VERSION"
            echo "@veljaos/$name@$published is published"
          done

      # The catalogue of this version, downloadable from the run (no Storybook is hosted).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-${{ steps.version.outputs.version }}
          path: apps/storybook/storybook-static
          if-no-files-found: error
          retention-days: 90
