# Changing this file is a protected change (BUILD-PLAN rule 10).
#
# One workflow: lint → typecheck → unit tests → build → consumer check → Storybook build →
# story tests → accessibility → visual (BUILD-PLAN P0.4), the last three split across machines
# (P3.0). The protected-files check runs in protected-files.yml, because it must also run when a
# pull request description is edited.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The name is kept from P0.1, so required-check settings keep matching.
    name: Install, lint, typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Consumer check (packed tarballs)
        run: pnpm consumer-check

      - name: Storybook build
        run: pnpm build-storybook

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-static
          path: apps/storybook/storybook-static
          if-no-files-found: error
          retention-days: 7

  # Story tests, accessibility and visual run on several machines at once (P3.0): each suite is
  # split into four parts with Playwright's --shard, one machine per part. On one machine the
  # three took about 37 minutes; see docs/decisions.md, CI.
  storybook-tests-shard:
    name: ${{ matrix.suite.name }} (${{ matrix.shard }}/4)
    needs: checks
    runs-on: ubuntu-24.04
    # Each Playwright run stops itself after 25 minutes (globalTimeout in playwright.config.ts),
    # stopping its server with it. No step has its own timeout: a step timeout kills Playwright
    # but not the server it started (P0.4a).
    timeout-minutes: 40
    # The official Playwright image, pinned by digest. Its version matches @playwright/test in
    # apps/storybook/package.json; visual baselines are generated only in this image.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    strategy:
      # Every part runs to the end, so one run shows every problem.
      fail-fast: false
      matrix:
        suite:
          - id: stories
            name: Story tests
            script: test:stories
          - id: a11y
            name: Accessibility (WCAG 2.2 AA, light/dark × ltr/rtl)
            script: test:a11y
          - id: visual
            name: Visual (light/dark × ltr/rtl)
            script: test:visual
        # The shard count (4) is also written in the job name and the run step.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: storybook-static
          path: apps/storybook/storybook-static

      # Starts its own server on the built Storybook (playwright.config.ts).
      - name: ${{ matrix.suite.name }}, part ${{ matrix.shard }} of 4
        env:
          DEBUG: pw:webserver
        run: pnpm --filter liro-storybook ${{ matrix.suite.script }} --shard=${{ matrix.shard }}/4

      # Each part's HTML report gets its own folder, so the parts can be joined below.
      - name: Name the report after the part
        if: ${{ failure() }}
        run: |
          if [ -d apps/storybook/playwright-report ]; then
            mv apps/storybook/playwright-report "apps/storybook/playwright-report-${{ matrix.suite.id }}-${{ matrix.shard }}"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright-results-${{ matrix.suite.id }}-${{ matrix.shard }}
          path: |
            apps/storybook/playwright-report-*
            apps/storybook/test-results
            apps/storybook/tests/__screenshots__
          retention-days: 14

  # The required check keeps its name: it passes only when every part above passed, so branch
  # protection and auto-merge work as before.
  storybook-tests:
    name: Story tests, accessibility, visual
    needs: storybook-tests-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      # On failure: every part's report, actual and diff images, and any baseline written for a
      # story that had none, joined into one artifact `playwright-results`, to be reviewed and
      # committed. Paths do not collide: reports have their part in the folder name, test results
      # are named per test, and baselines per story and mode.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.storybook-tests-shard.result == 'failure' }}
        with:
          pattern: playwright-results-*
          path: playwright-results
          merge-multiple: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ needs.storybook-tests-shard.result == 'failure' }}
        with:
          name: playwright-results
          path: playwright-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Every part passed
        env:
          RESULT: ${{ needs.storybook-tests-shard.result }}
        run: |
          echo "Story tests, accessibility and visual parts: $RESULT"
          test "$RESULT" = success
